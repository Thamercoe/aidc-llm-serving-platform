# In-cluster Prometheus scraping the vLLM engines every 15s: team-serving (the
# Qwen deployment) and llama-serving (the Llama deployment used in the benchmark).
# The PVC keeps 30 days of history across pod restarts. Apply with -n team.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: serving
        metrics_path: /metrics
        static_configs:
          - targets: ["team-serving:8000", "llama-serving:8000"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prom-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. At one replica the default resolves
  # to maxUnavailable 0 / maxSurge 1, so a restart starts the new pod BEFORE
  # stopping the old one. Both then mount this RWO PVC on the same node and the
  # second Prometheus dies on "lock DB directory: resource temporarily
  # unavailable", leaving the old pod serving the old config and the rollout
  # stuck forever.
  strategy:
    type: Recreate
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml",
                 "--storage.tsdb.retention.time=30d"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prom-config}
        - name: data
          persistentVolumeClaim: {claimName: prom-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app: prometheus}
  ports:
    - port: 9090
      targetPort: 9090
